# loop-landscape: fixed layout and motion. Text and numbers come from the
# project file through {{fields...}}; {round...} bindings are evaluated per frame.
canvas: {cols: 120, rows: 40, fps: 60}

palette:
  h2: [0, 215, 255]
  core: [180, 140, 255]
  gold: [255, 196, 87]
  task: [205, 182, 255]
  exec: [110, 168, 255]
  exp: [110, 224, 190]

style:
  flash: 0.3
  title_margin: 6
  core_pulse: {wires: [j_pr, j_pb, j_cm, j_fl], decay: 0.22}

title: {text: "{{title}}", row: 1, scatter: 52, hue_speed: 0.45}

data: {parts: "{{parts}}"}
rounds: "{{rounds}}"
counters: {lessons: {key: lessons, phase: to_ih, span: 0.9}}

timeline:
  intro: 1.6
  phases:
    - {name: task,     dur: 0.5,  kind: transfer}
    - {name: to_prop,  dur: 0.4,  kind: transfer}
    - {name: propose,  dur: 1.5,  kind: work}
    - {name: to_probe, dur: 0.35, kind: transfer}
    - {name: probe,    dur: 2.0,  kind: work}
    - {name: to_comp,  dur: 0.35, kind: transfer}
    - {name: compose,  dur: 1.3,  kind: work}
    - {name: run,      dur: 1.5,  kind: work}
    - {name: to_exp,   dur: 0.8,  kind: transfer}
    - {name: exp,      dur: 0.7,  kind: work}
    - {name: filter,   dur: 1.0,  kind: work}
    - {name: to_ih,    dur: 0.6,  kind: transfer}
    - {name: to_next,  dur: 0.8,  kind: transfer, skip_last: true}
  # Rounds speed up: 0.72 means the phase takes 72% of its listed duration.
  duration_scale:
    - {transfer: 1.0,  work: 1.0}
    - {transfer: 0.72, work: 0.8}
    - {transfer: 0.5,  work: 0.62}
  hold: 1.6
  freeze: 2.4
  outro: 1.5
  snapshot: {round: 2, phase: filter, at: 0.45}

boxes:
  - id: outer
    rect: [4, 3, 115, 36]
    color: h2
    style: frame
    title: "{{frame_title}}"
    lit: [{phase: to_next, level: 0.55}, {phase: to_prop, level: 0.55}]
    idle: 0.35

  - id: task
    rect: [8, 4, 41, 7]
    color: task
    title: "{{boxes.task}}"
    lit: [task, to_prop]
    content:
      - {type: text, row: 1, align: center, text: "{round.task}", color: soft, bold: true,
         typed: {phase: task, cps: 110, finish_at_end: true}, field: "rounds[].task"}

  - id: exec
    rect: [46, 4, 111, 7]
    color: exec
    title: "{{boxes.executor}}"
    lit: [probe, run]
    content:
      - {type: text, row: 0, align: center, text: "{{executor.subtitle}}", color: gray, field: executor.subtitle}
      - type: stages
        row: 1
        x: 3
        label_w: 26
        color: exec
        stages:
          - {from: probe, until: run, text: "{{executor.trial}}", cps: 110}
          - {from: run, text: "{{executor.running}}", done: "{{executor.done}} ✓", cps: 36}

  - id: propose
    rect: [8, 9, 41, 18]
    color: h2
    title: "{{boxes.propose}}"
    lit: [propose]
    lit_windows: [[0.5, 0.9]]
    content:
      - type: bars
        mode: rank
        phase: propose
        items: "{[[p, v] for p, v in zip(data.parts, round.part_scores)]}"
        seeds: "{[data.parts.index(n) for r in all_rounds[:ri] for n in r.learned]}"
        stagger: 0.55
        grow: 0.4
        lit_at: 0.6
        color: h2
        lit_color: gold

  - id: probe
    rect: [46, 9, 75, 18]
    color: h2
    title: "{{boxes.probe}}"
    lit: [probe]
    lit_windows: [[0.66, 1.06]]
    content:
      - type: race
        layout: two_line
        phase: probe
        names: "{['H' + str(i + 1) + ' ' + ' + '.join(c) for i, c in enumerate(round.candidates)]}"
        scores: "{round.candidate_scores}"
        fail: "{round.failing_candidate - 1}"
        winners: 2
        color: h2
        field: "rounds[].candidates"
      - {type: text, row: 7, x: 1, text: "{{probe_question}}", color: [mix, bg, core, 0.7], show: {phase: probe},
         field: probe_question}

  - id: compose
    rect: [80, 9, 111, 18]
    color: h2
    title: "{{boxes.compose}}"
    lit: [compose]
    lit_windows: [[0.82, 1.1]]
    content:
      - type: bars
        mode: keep
        mark: left
        phase: compose
        items: "{[[k.part, k.score] for k in round.kept]}"
        label_w: "{max(tw(p) for p in data.parts)}"
        threshold: "{{keep_at}}"
        stagger: 0.5
        grow: 0.4
        color: h2
        summary: {prefix: "→ H*  ", text: "{{compose_summary}}", row: 6, cps: 28.8}

  - id: jev
    rect: [40, 20, 79, 25]
    color: core
    style: core
    layer: live
    title: "{{boxes.core}}"
    core: {glow: 0.85, trail: 26}
    content:
      - type: ports
        tagline: "{{core.tagline}}"
        items:
          - {name: "{{core.ports.0}}", phase: propose, value: "{max(round.part_scores)}", x: 4, row: 2}
          - {name: "{{core.ports.1}}", phase: probe, value: "{max(round.candidate_scores)}", x: 22, row: 2}
          - {name: "{{core.ports.2}}", phase: compose, value: "{max(k.score for k in round.kept)}", x: 4, row: 3}
          - {name: "{{core.ports.3}}", phase: filter, value: "{max(round.filter_scores)}", x: 22, row: 3}

  - id: ih
    rect: [8, 28, 49, 35]
    color: gold
    title: "{{boxes.harness}}"
    lit: [to_ih]
    snapshot: 0.4
    content:
      - type: chips
        labels: "{data.parts}"
        key: learned
        phase: to_ih
        counter: {name: lessons, row: 5, label: "{{lessons_label}}"}
        next: {phase: to_next, x: 22, row: 5, text: "{{next_label}}"}

  - id: filt
    rect: [54, 28, 81, 35]
    color: core
    title: "{{boxes.filter}}"
    lit: [filter]
    lit_windows: [[0.98, 1.1]]
    snapshot: 0.7
    content:
      - type: bars
        mode: keep
        mark: right
        phase: filter
        row: 1
        items: "{[['e' + str(i + 1), v] for i, v in enumerate(round.filter_scores)]}"
        threshold: "{{keep_at}}"
        stagger: 0.5
        grow: 0.45
        color: core

  - id: exp
    rect: [86, 28, 111, 35]
    color: exp
    title: "{{boxes.experience}}"
    lit: [exp]
    snapshot: 0.7
    content:
      - type: lines
        phase: exp
        row: 1
        x: 2
        items: "{['e' + str(i + 1) + ' ' + k.part + ' ' + format(k.delta, '+.2f') for i, k in enumerate(round.kept)]}"
        step: 0.175
        cps: 110
        color: exp
        dim_color: [mix, exp, dim, 0.55]
        dim_negative: true
        flash: 0.15
        field: "rounds[].kept"

wires:
  - {id: t_p, path: [[24, 8], [24, 8]], color: task, arrow: [24, 8, "▼"], to: propose,
     pulses: [{phase: to_prop}, {at: 0.7, dur: 0.5}]}
  - {id: pp, path: [[42, 13], [45, 13]], color: h2, arrow: [45, 13, "▶"], to: probe,
     pulses: [{phase: to_probe}]}
  - {id: pc, path: [[76, 13], [79, 13]], color: h2, arrow: [79, 13, "▶"], to: compose,
     pulses: [{phase: to_comp}, {phase: compose, from: 0.05, to: 0.35, repeat: 2, step: 0.25}]}
  - {id: run_pb, path: [[61, 8], [61, 8]], color: exec, arrow: [61, 8, "▲"], to: exec,
     pulses: [{phase: probe, from: 0.12, to: 0.3, repeat: 3, step: 0.1}]}
  - {id: run_cm, path: [[96, 8], [96, 8]], color: exec, arrow: [96, 8, "▲"], to: exec,
     pulses: [{phase: run, to: 0.4}]}
  - {id: j_pr, path: [[38, 22], [25, 22], [25, 19]], color: core, arrow: [25, 19, "▲"], to: propose,
     pulses: [{phase: propose, to: 0.35}, {at: 0.0, dur: 0.5}]}
  - {id: j_pb, path: [[61, 19], [61, 19]], color: core, arrow: [61, 19, "▲"], to: probe,
     pulses: [{phase: probe, to: 0.2}, {at: 0.16, dur: 0.5}]}
  - {id: j_cm, path: [[81, 22], [96, 22], [96, 19]], color: core, arrow: [96, 19, "▲"], to: compose,
     pulses: [{phase: compose, to: 0.3}, {at: 0.32, dur: 0.5}]}
  - {id: j_fl, path: [[70, 26], [70, 27]], color: core, arrow: [70, 27, "▼"], to: filt,
     pulses: [{phase: filter, to: 0.3}, {at: 0.48, dur: 0.5}]}
  - {id: x_exp, path: [[112, 5], [113, 5], [113, 31], [112, 31]], color: exp, arrow: [112, 31, "◀"], to: exp,
     pulses: [{phase: to_exp, from: 0, from_step: 0.18, to: 0.7, to_step: 0.15, repeat: 3}]}
  - {id: e_f, path: [[85, 31], [82, 31]], color: exp, arrow: [82, 31, "◀"], to: filt,
     pulses: [{phase: exp, from: 0.5, to: 1.0, plus_to: 0.25}]}
  - {id: f_ih, path: [[53, 31], [50, 31]], color: gold, arrow: [50, 31, "◀"], to: ih,
     pulses: [{phase: to_ih, from: 0, to: 0.6, step: 0.2, repeat: 3}]}
  - {id: loop, path: [[7, 31], [6, 31], [6, 13], [7, 13]], color: gold, arrow: [7, 13, "▶"], to: propose,
     pulses: [{phase: to_next, from: 0, from_step: 0.12, to: 0.7, to_step: 0.1, repeat: 3}]}

overlay:
  - type: status
    z: top
    row: 38
    style: brackets
    gap: 3
    items:
      - {key: "{{status.round}}", value: "{round.n}/{rounds}"}
      - {key: "{{status.conf}}", value: "{max(round.part_scores):.2f}", after: {phase: propose}}
      - {key: "{{status.score}}", value: "{max(round.candidate_scores):.2f}", after: {phase: probe, at: 1.0}}
      - {key: "{{status.lessons}}", value: "{counter.lessons}", accent: true}
      - {key: "{{status.speed}}", value: "{'--' if round.get('speed') is None else format(round.speed, '.1f') + 'x'}"}
