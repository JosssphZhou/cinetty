# A fictional keyboard-to-Bluetooth board. Same layout and timeline as the reference video;
# part names and nets are made up for this example.
template: circuit-flow
template_version: 1
name: circuit-flow-en
fields:
  title: RETRO KEYBOARD + BLE
  modules:
    A:
      name: CHARGER + SW1
      role: Charger and main switch
      details:
      - J2 BAT+ BAT-
      - CHG_OUT
    B:
      name: BLE MCU MODULE
      role: Bluetooth controller module
      details:
      - P1 VBAT_ADC  P2 BOOST_EN
      - P3 VBAT_EN   P4 PWR_5V
      - P5 TP_DATA   P6 TP_CLK
      - P7 P8 P9 P10  LED PWM
    C:
      name: KEYBOARD FPC 40P
      role: Keyboard ribbon cable
      details:
      - 40-pin 0.5 mm FPC
      - J1
    D:
      name: CHARGE PUMP + RESET
      role: Pointing stick boost and reset
      details:
      - U3 5 V charge pump
      - U4 reset timer
    E:
      name: N-FET x2
      role: Pointing stick levels
      details:
      - Q1 TP_CLK
      - Q2 TP_DATA
    F:
      name: P-FET + N-FET
      role: Battery voltage sense
      details:
      - Q3 P-FET
      - Q4 N-FET
    G:
      name: LED x4
      role: Keyboard status lights
      details:
      - CAPS  PWR
      - MUTE  MIC
    H:
      name: R1 C1 + JP1 JP2 + J3
      role: Power key, Fn, debug
      details:
      - FN_KEY-SNS4 FN_RTN-DRV9
      - SWD  flashing only
  nets:
    a_d: VSYS
    a_f: VSYS
    a_b: VIN_CORE
    b_d: BOOST_EN
    d_e: +5V_TP
    b_e: TP_CLK  TP_DATA
    d_c: +5V_TP  TP_RESET
    e_c:
    - TP_CLK_5V
    - TP_DATA_5V
    f_b: VBAT_ADC
    b_f: VBAT_EN
    b_c: DRV0-15
    c_b: SNS0-7
    b_g: LED_*_PWM
    g_c: LED_*_K
    h_c:
    - PWR_SW
    - FN_KEY
    - FN_RTN
    h_b:
    - PWR_5V
    - SNS4
    - DRV9
  legend:
    power: power
    core: controller
    keys: keyboard
    level: level shift
    io: keys and debug
  log_title: execution log
  clock_start: '12:00:00'
  prompt:
    path: ~/kbd $
    command: kbd "power on, press Caps Lock and Fn"
  status:
  - key: vbat
    initial: --
  - key: 3v3
    initial: --
  - key: 5v
    initial: --
  - key: reset
    initial: hold
  - key: ble
    initial: 'off'
  - key: scan
    initial: idle
  - key: keys
    initial: --
events:
  - {t: 3.0, type: light, box: A, until: 7.0}
  - {t: 3.2, type: log, color: power, tag: power, text: 'SW1 closed, CHG_OUT reaches VSYS through the switch'}
  - {t: 3.4, type: pulse, wire: a_d, dur: 1.0}
  - {t: 3.4, type: pulse, wire: a_f, dur: 1.0}
  - {t: 4.4, type: light, box: F, until: 5.4}
  - {t: 4.6, type: pulse, wire: a_b, dur: 1.4}
  - {t: 4.6, type: log, color: power, tag: power, text: VSYS feeds VIN_CORE through a diode to the BLE controller}
  - {t: 6.0, type: light, box: B, until: 60.0}
  - {t: 6.2, type: status, key: 3v3, value: 3.3 V}
  - {t: 7.4, type: light, box: C, until: 9.4}
  - {t: 7.6, type: light, box: H, until: 11.0}
  - {t: 7.6, type: pulse, wire: h_c, dur: 1.3, dir: -1, label: h_c.0}
  - {t: 7.6, type: log, color: io, tag: boot, text: 'power key pressed, PWR_SW pulls PWR_5V through R1'}
  - {t: 9.0, type: pulse, wire: h_b, dur: 1.2, label: h_b.0}
  - {t: 10.2, type: log, color: core, tag: start, text: 'PWR_5V wakes P4, controller starts, Bluetooth connected'}
  - {t: 10.6, type: status, key: ble, value: connected}
  - {t: 11.4, type: pulse, wire: b_d, dur: 1.0}
  - {t: 11.4, type: log, color: power, tag: boost, text: 'P2 raises BOOST_EN, the charge pump outputs +5V_TP'}
  - {t: 12.4, type: light, box: D, until: 15.9}
  - {t: 12.6, type: pulse, wire: d_e, dur: 1.0}
  - {t: 12.6, type: pulse, wire: d_c, dur: 1.4}
  - {t: 13.0, type: status, key: 5v, value: 5.0 V}
  - {t: 14.4, type: pulse, wire: d_c, dur: 1.4}
  - {t: 14.4, type: log, color: power, tag: reset, text: 'reset timer done, TP_RESET released'}
  - {t: 15.8, type: light, box: C, until: 60.0}
  - {t: 15.8, type: status, key: reset, value: released}
  - {t: 17.4, type: light, box: E, until: 22.4}
  - {t: 17.4, type: pulse, wire: b_e, dur: 1.2}
  - {t: 17.4, type: log, color: level, tag: stick, text: TP_CLK and TP_DATA shifted between 3.3 V and 5 V by two N-FETs}
  - {t: 18.4, type: pulse, wire: e_c, dur: 1.0}
  - {t: 20.0, type: pulse, wire: e_c, dur: 1.0, dir: -1}
  - {t: 21.0, type: pulse, wire: b_e, dur: 1.2, dir: -1}
  - {t: 23.0, type: pulse, wire: b_c, dur: 0.9}
  - {t: 23.0, type: log, color: keys, tag: scan, text: 'DRV0-15 driven one by one, SNS0-7 read back'}
  - {t: 23.0, type: status, key: scan, value: DRV x SNS}
  - {t: 23.9, type: pulse, wire: b_c, dur: 0.9}
  - {t: 24.8, type: pulse, wire: b_c, dur: 0.9}
  - {t: 25.4, type: pulse, wire: c_b, dur: 0.9}
  - {t: 25.8, type: log, color: keys, tag: key, text: 'key detected: Caps Lock'}
  - {t: 25.8, type: status, key: keys, value: caps}
  - {t: 27.4, type: pulse, wire: b_g, dur: 1.0}
  - {t: 27.4, type: log, color: keys, tag: light, text: 'P7 drives LED_CAPS_PWM, CAPS light on'}
  - {t: 27.6, type: light, box: G, until: 60.0}
  - {t: 28.4, type: pulse, wire: g_c, dur: 1.4}
  - {t: 28.6, type: highlight, box: G, text: CAPS, color: keys}
  - {t: 31.0, type: light, box: H, until: 36.0}
  - {t: 31.0, type: pulse, wire: h_b, dur: 1.0, dir: -1, label: h_b.2}
  - {t: 31.0, type: log, color: io, tag: Fn, text: 'Fn pressed: DRV9 to FN_RTN through JP2, FN_KEY read on SNS4 through JP1'}
  - {t: 31.9, type: light, box: C, until: 34.4}
  - {t: 32.0, type: pulse, wire: h_c, dur: 1.0, label: h_c.2}
  - {t: 33.4, type: pulse, wire: h_c, dur: 1.0, dir: -1, label: h_c.1}
  - {t: 34.4, type: pulse, wire: h_b, dur: 1.2, label: h_b.1}
  - {t: 34.6, type: status, key: keys, value: caps fn}
  - {t: 37.0, type: light, box: F, until: 45.0}
  - {t: 37.0, type: pulse, wire: b_f, dur: 1.0}
  - {t: 37.0, type: log, color: power, tag: battery, text: 'VBAT_EN high, ADC samples VBAT_ADC after 3 ms'}
  - {t: 39.0, type: pulse, wire: f_b, dur: 1.0}
  - {t: 39.6, type: log, color: power, tag: battery, text: 'VBAT_ADC reads 1.89 V, so VBAT is 4.20 V'}
  - {t: 40.0, type: status, key: vbat, value: 4.20 V}
  - {t: 40.0, type: status, key: scan, value: idle}
